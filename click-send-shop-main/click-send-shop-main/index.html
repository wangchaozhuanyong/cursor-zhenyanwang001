    <!-- 浏览器标签优先使用后台配置的动态透明 favicon；PWA 安装图标同样由后端按品牌动态生成。 -->
    <link rel="icon" type="image/png" sizes="192x192" href="/api/pwa/icon-192x192.png" />
    <link rel="shortcut icon" type="image/png" href="/api/pwa/icon-192x192.png" />
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var key = "site:brand:favicon";
          var raw = window.localStorage && window.localStorage.getItem(key);
          if (!raw) return;
          var payload = JSON.parse(raw);
          var href = typeof payload.href === "string" ? payload.href.trim() : "";
          var savedAt = Number(payload.savedAt || 0);
          var maxAge = 7 * 24 * 60 * 60 * 1000;
          if (!href || !savedAt || Date.now() - savedAt > maxAge) {
            window.localStorage.removeItem(key);
            return;
          }
          document
            .querySelectorAll("link[rel='icon'], link[rel='shortcut icon'], link[rel='apple-touch-icon']")
            .forEach(function (el) {
              el.parentNode && el.parentNode.removeChild(el);
            });
          [
            { rel: "icon", href: href },
            { rel: "shortcut icon", href: href },
            { rel: "apple-touch-icon", href: href },
          ].forEach(function (item) {
            var link = document.createElement("link");
            link.rel = item.rel;
            link.href = item.href;
            document.head.appendChild(link);
          });
        } catch (_e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
      }
      body {
        background: #f7f9f6;
      }
      #root {
        min-height: 100dvh;
      }
      #app-preboot {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: linear-gradient(145deg, #f7f9f6 0%, #eef5f1 54%, #f8faf8 100%);
        color: #12362d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        transition:
          opacity 180ms ease-out,
          visibility 180ms step-end;
      }
      #app-preboot.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-preboot-card {
        position: relative;
        z-index: 1;
        width: min(82vw, 24rem);
        text-align: center;
      }
      .app-preboot-orbit {
        position: relative;
        display: grid;
        width: 6.75rem;
        height: 6.75rem;
        margin: 0 auto 1.1rem;
        place-items: center;
        border-radius: 999px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.94), rgba(238, 248, 243, 0.78));
        box-shadow:
          0 1.4rem 4rem rgba(10, 80, 61, 0.16),
          inset 0 0 0 1px rgba(206, 161, 82, 0.28);
      }
      .app-preboot-orbit::before {
        content: "";
        position: absolute;
        inset: -0.46rem;
        z-index: -1;
        border-radius: inherit;
        background: linear-gradient(145deg, rgba(224, 176, 86, 0.58), rgba(20, 135, 104, 0.18));
      }
      .app-preboot-mark {
        display: grid;
        width: 4.55rem;
        height: 4.55rem;
        place-items: center;
        border-radius: 999px;
        background:
          linear-gradient(145deg, #0a7055, #0f4e3e 68%, #6fd2bd 160%);
        color: #fff7df;
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: 0;
        box-shadow: inset 0 0 0 1px rgba(255, 244, 205, 0.38);
      }
      .app-preboot-logo {
        display: block;
        width: 4.55rem;
        height: 4.55rem;
        border-radius: 999px;
        object-fit: contain;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: inset 0 0 0 1px rgba(255, 244, 205, 0.38);
      }
      .app-preboot-logo[hidden] {
        display: none;
      }
      .app-preboot-orbit[data-logo-ready="true"] .app-preboot-mark {
        display: none;
      }
      .app-preboot-title {
        margin: 0;
        color: #143b31;
        font-size: clamp(1.75rem, 8vw, 2.45rem);
        font-weight: 850;
        letter-spacing: 0;
      }
      .app-preboot-subtitle {
        margin: 0.45rem 0 0;
        color: rgba(20, 59, 49, 0.66);
        font-size: 0.82rem;
        font-weight: 650;
        letter-spacing: 0.12em;
        text-transform: none;
      }
      .app-preboot-line {
        position: relative;
        height: 0.28rem;
        margin: 2rem auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(13, 104, 80, 0.1);
      }
      .app-preboot-line::before {
        content: "";
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #0d7e61 18%, #ddb15d 72%, transparent);
        animation: app-preboot-thread 1.45s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .app-preboot-note {
        margin: 0.8rem 0 0;
        color: rgba(20, 59, 49, 0.52);
        font-size: 0.75rem;
      }
      @keyframes app-preboot-thread {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(245%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-preboot,
        .app-preboot-line::before {
          animation: none !important;
        }
        #app-preboot {
          transition-duration: 180ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-preboot" aria-busy="true" aria-label="大马通正在加载">
      <div class="app-preboot-card">
        <div class="app-preboot-orbit" aria-hidden="true">
          <img class="app-preboot-logo" alt="" decoding="async" fetchpriority="high" hidden />
          <div class="app-preboot-mark">马</div>
        </div>
        <p class="app-preboot-title">大马通</p>
        <p class="app-preboot-subtitle">正在加载</p>
        <div class="app-preboot-line" aria-hidden="true"></div>
        <p class="app-preboot-note">请稍候，正在准备页面</p>
      </div>
    </div>
    <script>
      (function () {
        var preboot = document.getElementById("app-preboot");
        if (!preboot) return;
        var startedAt = Date.now();
        var minVisibleMs = 100;
        var maxVisibleMs = 1800;
        var leaving = false;

        (function syncPrebootLogo() {
          var orbit = preboot.querySelector(".app-preboot-orbit");
          var logo = preboot.querySelector(".app-preboot-logo");
          if (!orbit || !logo) return;

          var logoCacheKey = "site:brand:preboot-logo";
          var faviconCacheKey = "site:brand:favicon";
          var maxAge = 7 * 24 * 60 * 60 * 1000;

          function trim(value) {
            return typeof value === "string" ? value.trim() : "";
          }

          function normalizeAssetUrl(value) {
            var href = trim(value);
            if (!href || /lovable/i.test(href)) return "";
            if (href.indexOf("//") === 0) return window.location.protocol + href;
            if (/^(?:https?:|data:|blob:)/i.test(href)) return href;
            if (href.charAt(0) === "/") return window.location.origin + href;
            return href;
          }

          function readCachedLogo(key) {
            try {
              var raw = window.localStorage && window.localStorage.getItem(key);
              if (!raw) return "";
              var payload = JSON.parse(raw);
              var href = normalizeAssetUrl(payload && payload.href);
              var savedAt = Number((payload && payload.savedAt) || 0);
              if (!href || !savedAt || Date.now() - savedAt > maxAge) {
                window.localStorage.removeItem(key);
                return "";
              }
              return href;
            } catch (_e) {
              return "";
            }
          }

          function applyLogo(href) {
            var next = normalizeAssetUrl(href);
            if (!next || logo.getAttribute("src") === next) return;
            logo.onload = function () {
              logo.hidden = false;
              orbit.setAttribute("data-logo-ready", "true");
            };
            logo.onerror = function () {
              logo.hidden = true;
              orbit.removeAttribute("data-logo-ready");
            };
            logo.hidden = true;
            orbit.removeAttribute("data-logo-ready");
            logo.setAttribute("src", next);
          }

          applyLogo(readCachedLogo(logoCacheKey) || readCachedLogo(faviconCacheKey));
        })();

        function leave() {
          if (leaving) return;
          leaving = true;
          preboot.classList.add("is-leaving");
          window.setTimeout(function () {
            if (preboot && preboot.parentNode) {
              preboot.parentNode.removeChild(preboot);
            }
          }, 220);
        }

        function requestLeave() {
          var remaining = Math.max(0, minVisibleMs - (Date.now() - startedAt));
          window.setTimeout(leave, remaining);
        }

        window.addEventListener("app:shell-ready", requestLeave, { once: true });
        window.setTimeout(leave, maxVisibleMs);
      })();
    </script>
    <script src="/browser-preboot.js"></script>
    <script type="module">
      try {
        if (typeof import.meta.resolve !== "function") {
          import.meta.resolve = (specifier) => specifier;
        }
      } catch (_) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
